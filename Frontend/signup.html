<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form action="/users" method="POST" id="signupForm">
            <div>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" name="phoneNumber" required>
            </div>
            <div>
                <label for="type">Account Type (Enter 'Client' or 'Company'):</label>
                <input type="text" id="type" name="type" required>
            </div>
        
            <div id="companyFields" style="display:none;">
                <div>
                    <label for="companyName">Company Name:</label>
                    <input type="text" id="companyName" name="companyName">
                </div>
            </div>
            
            <div id="clientFields" style="display:none;">
                <div>
                    <label for="clientName">Client Name:</label>
                    <input type="text" id="clientName" name="clientName">
                </div>
            </div>
        
            <button type="submit">Sign Up</button>
        </form>
        
        <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <script>
        // JavaScript to toggle fields based on the account type input
        const typeInput = document.getElementById('type');
        const companyFields = document.getElementById('companyFields');
        const clientFields = document.getElementById('clientFields');

        typeInput.addEventListener('input', function () {
            const accountType = typeInput.value.trim().toLowerCase();
            if (accountType === 'company') {
                companyFields.style.display = 'block';
                clientFields.style.display = 'none';
            } else if (accountType === 'client') {
                companyFields.style.display = 'none';
                clientFields.style.display = 'block';
            } else {
                companyFields.style.display = 'none';
                clientFields.style.display = 'none';
            }
        });
    </script>
</body>
</html>
