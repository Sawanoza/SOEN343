<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Orders</title>
    <link rel="stylesheet" href="../CSS/ordersUser.css">
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Container">
        <div class="FormWrap">
            <a class="Icon" href="http://localhost:3001/">Delivery.</a>
            <div class="FormContent">
                <div class="Header">
                    <h1>Your Orders</h1>
                </div>
                
                <!-- Table to display orders -->
                <table id="ordersTable" class="OrdersTable">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Estimated Delivery Date</th>
                            <th>Status</th>
                            <th>PIN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dynamically inserted here -->
                    </tbody>
                </table>

                <div class="ButtonWrapper">
                    <button class="FormButton" onclick="window.location.href='userPage.html'">Back to Dashboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchOrders() {
            const trackingIds = JSON.parse(localStorage.getItem('myList')) || [];
            
            if (trackingIds.length === 0) {
                alert('No orders found in local storage.');
                return;
            }

            try {
                const orders = await Promise.all(
                    trackingIds.map(async (trackingId) => {
                        const response = await fetch(`http://localhost:3000/order/${trackingId}`);
                        if (response.ok) {
                            return response.json();
                        }
                        return null;
                    })
                );
    
                const tableBody = document.querySelector('#ordersTable tbody');
                tableBody.innerHTML = '';

                orders.forEach((order) => {
                    if (order) {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${order.trackingID}</td>
                            <td>${order.arrivalDate}</td>
                            <td>${order.orderStatus}</td>
                            <td>${order.pin}</td>
                        `;
                        tableBody.appendChild(row);
                    }
                });
                
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while fetching orders.');
            }
        }
    
        document.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>
</html>
