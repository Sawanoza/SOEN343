<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Orders</title>
    <link rel="stylesheet" href="../CSS/orders.css">
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Container">
        <div class="FormWrap">
            <a class="Icon" href="http://localhost:3001/">Delivery.</a>
            <div class="FormContent">
                <div class="Header">
                    <h1>All Orders</h1>
                </div>
                
                <!-- Table to display order data -->
                <table id="ordersTable" class="OrdersTable">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Delivery Address</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dynamically inserted here -->
                    </tbody>
                </table>

                <div class="ButtonWrapper">
                    <button class="FormButton" onclick="window.location.href='adminPage.html'">Back to Admin Dashboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        //==================================================================================================
        // GET ALL ORDERS
        //==================================================================================================
        async function fetchOrders() {
            try {
                const response = await fetch('http://localhost:3000/api/orders');
                const orders = await response.json();

                if (response.ok) {
                    //populate table with fetched order data
                    const tableBody = document.querySelector('#ordersTable tbody');
                    tableBody.innerHTML = '';

                    orders.forEach(order => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${order.id}</td>
                            <td>${order.customerName}</td>
                            <td>${order.deliveryAddress}</td>
                            <td>${order.status}</td>
                            <td><button class="deleteBtn" onclick="deleteOrder(${order.id})">Delete</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    alert('Unable to fetch orders. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while fetching orders.');
            }
        }
        //==================================================================================================



        //==================================================================================================
        // ORDER DELETION
        //==================================================================================================
        async function deleteOrder(orderId) {
            const confirmation = confirm('Are you sure you want to delete this order?');
            if (!confirmation) return;

            try {
                const response = await fetch(`http://localhost:3000/api/orders/${orderId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('Order deleted successfully');
                    fetchOrders();
                } else {
                    alert('Unable to delete order. Please try again.');
                }
            } catch (error) {
                console.error('Error deleting order:', error);
                alert('An error occurred while deleting the order.');
            }
        }
        //==================================================================================================

        //fetchOrders function when page loads
        document.addEventListener('DOMContentLoaded', fetchOrders);
        
    </script>
</body>
</html>
