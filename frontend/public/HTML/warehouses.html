<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Warehouses</title>
    <link rel="stylesheet" href="../CSS/warehouses.css">
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="Container">
        <div class="FormWrap">
            <a class="Icon" href="http://localhost:3001/">Delivery.</a>
            <div class="FormContent">
                <div class="Header">
                    <h1>All Warehouses</h1>
                </div>

                <!-- Table to display order data -->
                <table id="warehousesTable" class="WarehousesTable">
                    <thead>
                        <tr>
                            <th>Warehouse ID</th>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Capacity</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dynamically inserted here -->
                    </tbody>
                </table>

                <div class="ButtonWrapper">
                    <button class="FormButton" onclick="window.location.href='adminPage.html'">Back to Admin
                        Dashboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        //==================================================================================================
        // GET ALL WAREHOUSES
        //==================================================================================================
        async function fetchWarehouses() {
            try {
                const response = await fetch('http://localhost:3000/warehouse');
                const warehouses = await response.json();

                if (response.ok) {
                    const tableBody = document.querySelector('#warehousesTable tbody');
                    tableBody.innerHTML = '';

                    warehouses.forEach(warehouse => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${warehouse.id}</td>
                            <td>${warehouse.name}</td>
                            <td>${warehouse.location}</td>
                            <td>${warehouse.capacity}</td>
                            <td>${warehouse.status}</td>
                            <td><button class="deleteBtn" onclick="deleteWarehouse(${warehouse.id})">Delete</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    alert('Unable to fetch warehouses. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while fetching warehouses.');
            }
        }
        //==================================================================================================



        //==================================================================================================
        // WAREHOUSE DELETION
        //==================================================================================================
        async function deleteWarehouse(warehouseId) {
            const confirmation = confirm('Are you sure you want to delete this warehouse?');
            if (!confirmation) return;

            try {
                const response = await fetch(`http://localhost:3000/warehouse/${warehouseId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('Warehouse deleted successfully');
                    fetchWarehouses(); // Refresh the warehouse list
                } else {
                    alert('Unable to delete warehouse. Please try again.');
                }
            } catch (error) {
                console.error('Error deleting warehouse:', error);
                alert('An error occurred while deleting the warehouse.');
            }
        }
        //fetchWarehouses function when page loads
        document.addEventListener('DOMContentLoaded', fetchWarehouses);

    </script>
</body>

</html>
