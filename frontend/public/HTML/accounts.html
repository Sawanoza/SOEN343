<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Accounts</title>
    <link rel="stylesheet" href="../CSS/accounts.css">
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Container">
        <div class="FormWrap">
            <a class="Icon" href="http://localhost:3001/">Delivery.</a>
            <div class="FormContent">
                <div class="Header">
                    <h1>All Accounts</h1>
                </div>
                
                <!-- Table to display account data -->
                <table id="accountsTable" class="AccountsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Phone Number</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dynamically inserted here -->
                    </tbody>
                </table>

                <div class="ButtonWrapper">
                    <button class="FormButton" onclick="window.location.href='adminPage.html'">Back to Admin Dashboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        //==================================================================================================
        // GET ALL ACCOUNTS
        //==================================================================================================
        async function fetchAccounts() {
            try {
                const response = await fetch('http://localhost:3000/api/accounts');
                const accounts = await response.json();

                if (response.ok) {
                    //populate table with fetched account data
                    const tableBody = document.querySelector('#accountsTable tbody');
                    tableBody.innerHTML = '';

                    accounts.forEach(account => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${account.id}</td>
                            <td>${account.email}</td>
                            <td>${account.phoneNumber}</td>
                            <td><button class="deleteBtn" onclick="deleteAccount(${account.id})">Delete</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    alert('Unable to fetch accounts. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while fetching accounts.');
            }
        }
        //==================================================================================================



        //==================================================================================================
        // ACCOUNT DELETION
        //==================================================================================================
        async function deleteAccount(accountId) {
            const confirmation = confirm('Are you sure you want to delete this account?');
            if (!confirmation) return;

            try {
                const response = await fetch(`http://localhost:3000/api/accounts/${accountId}`, {
                    method: 'DELETE',
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Account deleted successfully');
                    fetchAccounts(); //refresh list of accounts
                } else {
                    alert(result.error || 'An error occurred');
                }
            } catch (error) {
                console.error('Error deleting account:', error);
                alert('An error occurred while deleting the account');
            }
        }
        //==================================================================================================

        //fetchAccounts function when page loads
        document.addEventListener('DOMContentLoaded', fetchAccounts);

    </script>
</body>
</html>
