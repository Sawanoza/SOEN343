<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    /* Your styles remain unchanged */
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Create Account</h1>
    <form id="createAccountForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="phoneNumber">Phone Number:</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" required>
      </div>
      <div class="form-group">
        <button type="submit">Sign Up</button>
      </div>
      <p class="error-message" id="errorMessage"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('createAccountForm');
    const errorMessage = document.getElementById('errorMessage');
  
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
  
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const phoneNumber = document.getElementById('phoneNumber').value;
  
      const userData = {
        email,
        password,
        phoneNumber,
        type: 'client'  // Hardcode type as 'client'
      };
  
      try {
        const response = await fetch('http://localhost:3000/api/accounts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(userData),
        });
  
        const result = await response.json();
  
        if (response.ok) {
          // Handle success (you can redirect or show success message)
          alert('Account created successfully');
        } else {
          // Handle errors
          errorMessage.textContent = result.error || 'An error occurred. Please try again.';
        }
      } catch (error) {
        console.error('Error:', error);
        errorMessage.textContent = 'Unable to create account. Please try again.';
      }
    });
  </script>
  
</body>
</html>
