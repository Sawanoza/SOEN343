<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Transporters</title>
    <link rel="stylesheet" href="../CSS/transporters.css">
    <link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="Container">
        <div class="FormWrap">
            <a class="Icon" href="http://localhost:3001/">Delivery.</a>
            <div class="FormContent">
                <div class="Header">
                    <h1>All Transporters</h1>
                </div>
                
                <!-- Table to display order data -->
                <table id="transportersTable" class="TransportersTable">
                    <thead>
                        <tr>
                            <th>Transporter ID</th>
                            <th>Name</th>
                            <th>Vehicle Type</th>
                            <th>Phone Number</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data dynamically inserted here -->
                    </tbody>
                </table>

                <div class="ButtonWrapper">
                    <button class="FormButton" onclick="window.location.href='adminPage.html'">Back to Admin Dashboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        //==================================================================================================
        // GET ALL TRANSPORTERS
        //==================================================================================================
        async function fetchTransporters() {
            try {
                const response = await fetch('http://localhost:3000/transporter');
                const transporters = await response.json();
                console.log(transporters);
                if (response.ok) {
                    const tableBody = document.querySelector('#transportersTable tbody');
                    tableBody.innerHTML = '';

                    transporters.forEach(transporter => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${transporter.id}</td>
                            <td>${transporter.name}</td>
                            <td>${transporter.vehicleType}</td>
                            <td>${transporter.phoneNumber}</td>
                            <td><button class="deleteBtn" onclick="deleteTransporter(${transporter.id})">Delete</button></td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    alert('Unable to fetch transporters. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while fetching transporters.');
            }
        }
        //==================================================================================================



        //==================================================================================================
        // TRANSPORTER DELETION
        //==================================================================================================
        async function deleteTransporter(transporterId) {
            const confirmation = confirm('Are you sure you want to delete this transporter?');
            if (!confirmation) return;

            try {
                const response = await fetch(`http://localhost:3000/transporter/${transporterId}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    alert('Transporter deleted successfully');
                    fetchTransporters();
                } else {
                    alert('Unable to delete transporter. Please try again.');
                }
            } catch (error) {
                console.error('Error deleting transporter:', error);
                alert('An error occurred while deleting the transporter.');
            }
        }
        //==================================================================================================

        //fetchTransporters function when page loads
        document.addEventListener('DOMContentLoaded', fetchTransporters);

    </script>
</body>
</html>
